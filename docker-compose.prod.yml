services:
  # Application Service (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: nouni_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - ./storage:/var/www/html/storage
      - ./public:/var/www/html/public
    networks:
      - nouni_internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx Service
  nginx:
    image: nginx:alpine
    container_name: nouni_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./storage/app/public:/var/www/html/storage/app/public:ro
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot
    networks:
      - nouni_internal
      - nouni_external
    depends_on:
      - app

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot:latest
    container_name: nouni_certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    networks:
      - nouni_external

  # MySQL Service
  db:
    image: mysql:8.0
    container_name: nouni_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-fhmaison}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_USER: ${DB_USERNAME:-fh_user}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - nouni_internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Service
  redis:
    image: redis:alpine
    container_name: nouni_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - redis_data:/data
    networks:
      - nouni_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: nouni_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    env_file:
      - .env
    volumes:
      - ./storage:/var/www/html/storage
    networks:
      - nouni_internal
    depends_on:
      - app
      - db
      - redis

  # Scheduler (Cron)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: nouni_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    env_file:
      - .env
    volumes:
      - ./storage:/var/www/html/storage
    networks:
      - nouni_internal
    depends_on:
      - app
      - db
      - redis

# Docker Networks
networks:
  nouni_internal:
    driver: bridge
  nouni_external:
    driver: bridge

# Volumes
volumes:
  db_data:
  redis_data:
  certbot_etc:
  certbot_webroot:
