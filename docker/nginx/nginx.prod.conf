# Initial nginx config for obtaining SSL certificate
# This will be replaced after certificate is obtained

server {
    listen 80;
    listen [::]:80;
    server_name fhmaison.fr www.fhmaison.fr;

    root /var/www/html/public;
    index index.php index.html index.htm;

    # Allow ACME challenge for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Block access to sensitive files
    location ~ /\.env {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    location ~ ^/(\.git|\.svn|\.hg|vendor|node_modules|storage/app|storage/framework|bootstrap/cache) {
        deny all;
        return 404;
    }

    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist|yml|yaml|lock)$ {
        deny all;
        return 404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location /storage {
        alias /var/www/html/storage/app/public;
    }
}
